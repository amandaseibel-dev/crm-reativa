# Portão de qualidade do CRM. NÃO publica nada, NÃO fala com o Supabase e NÃO
# tem segredo nenhum: só baixa o código, instala e roda o que já existe aqui.
# Repositório é público, então o minuto de execução custa US$ 0,00.
#
# O que trava um merge:
#   - teste quebrado  (a rede de 447 testes existia e não rodava sozinha)
#   - build quebrado  (build quebrado = tela branca em produção)
#   - lint PIORANDO   (ver scripts/ci/catraca-lint.mjs)
#   - migration PIORANDO o histórico (ver scripts/ci/catraca-migrations.mjs)
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um PR atualizado cancela a execução anterior — não faz fila à toa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: testes, build e catracas
    runs-on: ubuntu-latest
    # 25 e não 15: com 15 a suíte morria por timeout e o run aparecia como
    # "cancelled", que se confunde com cancelamento humano. Medido em 30/09/2026:
    # a suíte levava 11m49s num run e 14m20s em outro — a variação do runner
    # decidia se passava. Dois runs morreram em ~15m15s, inclusive o da própria
    # main. O repositório é público, então o minuto de Actions custa US$ 0,00 e a
    # folga não tem preço a pagar. Isto compra margem; não resolve crescimento —
    # se voltar a apertar, o caminho é separar os testes de banco em outro job.
    #
    # APERTOU DE NOVO: 25 -> 40 em 20/10/2026. O job da PR #700 (run 39432797275,
    # job 118661906774) começou 13:42:57 e foi morto 14:08:16 — 25m19s contra o
    # teto de 25. Não foi teste reprovando: às 14:06:49 a suíte ainda estava
    # passando e a última linha do log é "The operation was canceled". Não foi
    # cancel-in-progress: nenhum run mais novo existia naquele ref. E não é caso
    # isolado — os 6 runs anteriores da main levaram 20, 12, 15, 13, 20 e 19 min,
    # ou seja a main já roda a 80% do teto e qualquer teste de banco novo estoura.
    #
    # Onde o tempo realmente está, medido nesse mesmo log: dos 4.207s somados por
    # arquivo, 4.111s (97,7%) são supabase/tests/ e 96s (2,3%) são src/. Então a
    # saída que este comentário sugeria acima — "separar os testes de banco em
    # outro job" — renderia um job de 2,3% e outro de 97,7%. O ganho real está em
    # repartir o PRÓPRIO grupo de Postgres em vários jobs paralelos.
    timeout-minutes: 40

    steps:
      # fetch-depth: 0 porque a catraca das migrations compara este ramo com o
      # branch base via `git diff`. Com o clone raso (padrão 1) não existe base
      # para comparar e a verificação não teria o que ler. Nenhum segredo é
      # usado: só o histórico do próprio repositório.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # 22 é o que a Vercel usa para publicar. Mesma versão aqui para o
          # build medido ser o build que vai para o ar.
          node-version: '22'
          cache: npm

      - name: Instalar (a partir do package-lock)
        run: npm ci

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

      - name: Catraca do lint
        run: node scripts/ci/catraca-lint.mjs

      # Não fala com o Supabase, não lê credencial, não consulta produção.
      # Trabalha só sobre o checkout Git: o legado é tolerado, nenhum PR novo
      # pode piorá-lo.
      #
      # CATRACA_BASE existe por causa do evento `push` em main: depois do push,
      # `origin/main` já aponta para o próprio HEAD, e a catraca sairia sem olhar
      # o commit que acabou de entrar. `github.event.before` é o SHA anterior ao
      # push e resolve isso.
      #
      # A condição `event_name == 'push'` NÃO é decoração. O payload de
      # `pull_request` com action `synchronize` TAMBÉM traz `before` -- e ali ele
      # é o head ANTERIOR do PR, não o branch de destino. Sem a condição, um PR
      # atualizado passaria a ser verificado só a partir do último push, e uma
      # violação introduzida num commit anterior do mesmo PR deixaria de ser
      # vista. Em pull_request o valor tem de ser vazio, para o script cair no
      # fallback por GITHUB_BASE_REF e comparar com o branch de destino.
      - name: Catraca das migrations
        env:
          CATRACA_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: npm run check:migrations

  # ---------------------------------------------------------------------------
  # Valida a proposta de banco num POSTGRES DE VERDADE, descartavel.
  #
  # Por que existe: teste de interface com RPC simulada nao prova que o SQL
  # funciona. Aqui a migration roda inteira -- CREATE TABLE, CREATE OR REPLACE,
  # revoke/grant e a guarda -- e a RPC de gravacao e chamada de verdade.
  #
  # Nao e producao, nao e servico pago e nao usa segredo: e um container que
  # nasce e morre com o job. Repositorio publico, minuto a US$ 0,00.
  #
  # Depois de aplicada, o arquivo vive em supabase/migrations/ -- e o job passa a
  # rodar A MIGRATION. Isso nao e detalhe: e o que impede o PR #542, que
  # redefine o mesmo classificador por DROP+CREATE, apagar esta correcao em
  # silencio. Se alguem reescrever o classificador sem o ramo conferido, o caso
  # 1 quebra aqui antes de chegar em producao.
  # ---------------------------------------------------------------------------
  proposta-conferido:
    name: proposta conferido em aberto (postgres isolado)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: teste
      DIR: supabase/tests/conferido_em_aberto

    steps:
      - uses: actions/checkout@v5

      - name: Onde está o SQL a validar?
        id: existe
        run: |
          APLICADA=supabase/migrations/20260928180725_conferido_em_aberto_efetividade_2026_2.sql
          PROPOSTA=supabase/propostas/PROPOSTA_conferido_em_aberto.sql
          if   [ -f "$APLICADA" ]; then ALVO="$APLICADA"
          elif [ -f "$PROPOSTA" ]; then ALVO="$PROPOSTA"
          else ALVO=""
          fi
          if [ -n "$ALVO" ]; then
            echo "roda=sim"      >> "$GITHUB_OUTPUT"
            echo "alvo=$ALVO"    >> "$GITHUB_OUTPUT"
            echo "Validando: $ALVO"
          else
            echo "roda=nao" >> "$GITHUB_OUTPUT"
            echo "Nem a migration nem a proposta existem — nada a validar."
          fi

      # 1. ambiente  2. estado de produção  3. A PROPOSTA  4. os casos.
      # ON_ERROR_STOP em todos: o primeiro erro derruba o job.
      - name: Montar ambiente, aplicar o SQL e rodar os casos
        if: steps.existe.outputs.roda == 'sim'
        env:
          ALVO: ${{ steps.existe.outputs.alvo }}
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f "$DIR/01_ambiente.sql"
          psql -v ON_ERROR_STOP=1 -f "$DIR/02_baseline.sql"
          psql -v ON_ERROR_STOP=1 -f "$ALVO"
          psql -v ON_ERROR_STOP=1 -f "$DIR/03_casos.sql"

  # ---------------------------------------------------------------------------
  # migration 20261030090000 — CONTINUIDADE de 48h e limite 5 por operador
  #
  # Aplica a migration num Postgres descartável e roda os 11 cenários:
  #   RESPOSTA, NOVA_ABORDAGEM, CONTINUIDADE, não-renovação da janela,
  #   LIMITE_OPERADOR, bloqueio não consome cota, CONTINUIDADE com cota
  #   esgotada, janela_horas=0 desliga CONTINUIDADE.
  # ---------------------------------------------------------------------------
  whatsapp-cadencia-continuidade:
    name: whatsapp cadencia continuidade (postgres isolado)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: teste
      DIR: supabase/tests/whatsapp_cadencia_continuidade
      MIGRATION: supabase/migrations/20261030090000_whatsapp_cadencia_continuidade_e_limite_5.sql

    steps:
      - uses: actions/checkout@v5

      # 1. ambiente  2. baseline (função sem CONTINUIDADE)  3. migration  4. casos
      - name: Montar ambiente, aplicar migration e rodar os 11 casos
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f "$DIR/01_ambiente.sql"
          psql -v ON_ERROR_STOP=1 -f "$DIR/02_baseline.sql"
          psql -v ON_ERROR_STOP=1 -f "$MIGRATION"
          psql -v ON_ERROR_STOP=1 -f "$DIR/03_casos.sql"

  # ---------------------------------------------------------------------------
  # PROPOSTA_staging_acordos_prime.sql — RLS, grants e isolamento do staging
  # de ACORDOS, num Postgres descartável.
  #
  # Por que num Postgres de serviço e não só em PGlite: o `ALTER DEFAULT
  # PRIVILEGES` do schema `public` é o que faz tabela nova nascer aberta para
  # `authenticated` — inclusive TRUNCATE, que a RLS não cobre. O ambiente
  # reproduz isso de propósito, para o revoke da proposta ter trabalho real.
  #
  # O MESMO SQL roda em PGlite por supabase/tests/staging_acordos_prime.test.js,
  # dentro da suíte. Este job existe para o resultado valer num Postgres de
  # verdade, com os três papéis do Supabase.
  # ---------------------------------------------------------------------------
  staging-acordos-rls:
    name: staging acordos — RLS e grants (postgres isolado)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: teste
      DIR: supabase/tests/staging_acordos_prime
      PROPOSTA: supabase/propostas/PROPOSTA_staging_acordos_prime.sql

    steps:
      - uses: actions/checkout@v5

      # 1. ambiente (papéis + a armadilha do default privilege)
      # 2. a proposta  3. os casos
      - name: Montar ambiente, aplicar a proposta e rodar os casos
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f "$DIR/01_ambiente.sql"
          psql -v ON_ERROR_STOP=1 -f "$PROPOSTA"
          psql -v ON_ERROR_STOP=1 -f "$DIR/02_casos.sql"

  # ---------------------------------------------------------------------------
  # trava de tabulação somente gestão no banco — 20261106140000
  #
  # Aplica a proposta num Postgres descartável e roda os 19 casos de permissão:
  # operador barrado em RETORNO_FINANCEIRO (com a mensagem certa, que NÃO fala
  # em "encerrar cobrança"), trava histórica de encerramento intacta, tabulação
  # comum livre, reescrita de código já gravado passando, as três colunas de
  # status vigiadas, INSERT barrado e INSERT comum livre, gestão autorizada só
  # pelo e-mail do token, sistema/cron sem ser barrado, piso literal
  # fail-closed com o catálogo desmarcado, e catálogo passando a barrar uma
  # tabulação recém-marcada.
  #
  # Os casos RECONECTAM como `teste_app` de propósito: o gatilho libera
  # `session_user in ('postgres', ...)` e este job roda psql como postgres --
  # pela conexão padrão a trava não dispararia e os casos passariam sem testar
  # nada. Ver o cabeçalho de 03_casos.sql.
  # ---------------------------------------------------------------------------
  tabulacao-so-gestao:
    name: trava tabulacao somente gestao (postgres isolado)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: teste
      DIR: supabase/tests/tabulacao_so_gestao

    steps:
      - uses: actions/checkout@v5

      - name: Onde está o SQL a validar?
        id: existe
        run: |
          APLICADA=$(ls supabase/migrations/*_tabulacao_so_gestao_no_banco.sql 2>/dev/null | head -1 || true)
          PROPOSTA=supabase/aguardando_aprovacao/20261106140000_tabulacao_so_gestao_no_banco.sql.pendente
          if   [ -n "$APLICADA" ] && [ -f "$APLICADA" ]; then ALVO="$APLICADA"
          elif [ -f "$PROPOSTA" ]; then ALVO="$PROPOSTA"
          else ALVO=""
          fi
          if [ -n "$ALVO" ]; then
            echo "roda=sim"   >> "$GITHUB_OUTPUT"
            echo "alvo=$ALVO" >> "$GITHUB_OUTPUT"
            echo "Validando: $ALVO"
          else
            echo "roda=nao" >> "$GITHUB_OUTPUT"
            echo "Nem a migration nem a proposta existem — nada a validar."
          fi

      # 1. ambiente  2. baseline (o estado de produção, lista literal e sem
      # INSERT)  3. A PROPOSTA  4. os 14 casos.
      # ON_ERROR_STOP em todos: o primeiro erro derruba o job.
      - name: Montar ambiente, aplicar o SQL e rodar os 19 casos
        if: steps.existe.outputs.roda == 'sim'
        env:
          ALVO: ${{ steps.existe.outputs.alvo }}
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f "$DIR/01_ambiente.sql"
          psql -v ON_ERROR_STOP=1 -f "$DIR/02_baseline.sql"
          psql -v ON_ERROR_STOP=1 -f "$ALVO"
          psql -v ON_ERROR_STOP=1 -f "$DIR/03_casos.sql"

  # ---------------------------------------------------------------------------
  # `acordos_pos_importacao` deixa de criar tabela de backup com TRUNCATE
  # aberto para `authenticated`. Correção de MENOR ALCANCE: uma linha no corpo
  # da função, só TRUNCATE, só authenticated, só a tabela que ela cria.
  #
  # O teste prova as duas pontas: que hoje a tabela nasce esvaziável (e que
  # authenticated de fato a esvazia, apesar da RLS), e que depois do patch o
  # TRUNCATE é negado. Prova também o ALCANCE: tabela criada antes segue
  # intacta, e o default privilege do schema não é alterado.
  # ---------------------------------------------------------------------------
  acordos-pos-importacao-sem-truncate:
    name: acordos_pos_importacao sem truncate (postgres isolado)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: teste
      DIR: supabase/tests/acordos_pos_importacao_sem_truncate
      MIGRATION: supabase/aguardando_aprovacao/20261108120000_acordos_pos_importacao_sem_truncate.sql.pendente
      ROLLBACK: supabase/aguardando_aprovacao/20261108120000_acordos_pos_importacao_sem_truncate.rollback.sql

    steps:
      - uses: actions/checkout@v5

      # 1. ambiente (papéis + default privilege)  2. a função como está hoje,
      # com o problema demonstrado  3. a migration  4. os 7 casos
      - name: Montar ambiente, demonstrar o problema, aplicar patch e rodar os casos
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f "$DIR/01_ambiente.sql"
          psql -v ON_ERROR_STOP=1 -f "$DIR/02_baseline.sql"
          psql -v ON_ERROR_STOP=1 -f "$MIGRATION"
          psql -v ON_ERROR_STOP=1 -f "$DIR/03_casos.sql"

      # 5. idempotência: a segunda aplicação TEM de ser recusada pela Guarda 1
      - name: Segunda aplicacao tem de ser recusada
        run: |
          set -uo pipefail
          if psql -v ON_ERROR_STOP=1 -f "$MIGRATION"; then
            echo ">> FALHOU: a migration rodou duas vezes; a guarda de idempotencia nao pegou" >&2
            exit 1
          fi
          echo "OK: segunda aplicacao recusada"

      # 6. o rollback, e a prova de que o comportamento volta ao anterior
      - name: Aplicar rollback e conferir reversao
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f "$ROLLBACK"
          psql -v ON_ERROR_STOP=1 -f "$DIR/04_rollback.sql"

      # 7. Security Gate contra o banco descartavel (audita o FIXTURE, nao a
      #    producao -- prova que o patch nao introduz achado BLOQUEIA)
      - name: Security Gate no banco descartavel
        run: |
          set -euo pipefail
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/teste" \
            scripts/seguranca/run_security_gate.sh
