# Portão de qualidade do CRM. NÃO publica nada, NÃO fala com o Supabase e NÃO
# tem segredo nenhum: só baixa o código, instala e roda o que já existe aqui.
# Repositório é público, então o minuto de execução custa US$ 0,00.
#
# O que trava um merge:
#   - teste quebrado  (a rede de 447 testes existia e não rodava sozinha)
#   - build quebrado  (build quebrado = tela branca em produção)
#   - lint PIORANDO   (ver scripts/ci/catraca-lint.mjs)
#   - migration PIORANDO o histórico (ver scripts/ci/catraca-migrations.mjs)
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um PR atualizado cancela a execução anterior — não faz fila à toa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: testes, build e catracas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth: 0 porque a catraca das migrations compara este ramo com o
      # branch base via `git diff`. Com o clone raso (padrão 1) não existe base
      # para comparar e a verificação não teria o que ler. Nenhum segredo é
      # usado: só o histórico do próprio repositório.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # 22 é o que a Vercel usa para publicar. Mesma versão aqui para o
          # build medido ser o build que vai para o ar.
          node-version: '22'
          cache: npm

      - name: Instalar (a partir do package-lock)
        run: npm ci

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

      - name: Catraca do lint
        run: node scripts/ci/catraca-lint.mjs

      # Não fala com o Supabase, não lê credencial, não consulta produção.
      # Trabalha só sobre o checkout Git: o legado é tolerado, nenhum PR novo
      # pode piorá-lo.
      #
      # CATRACA_BASE existe por causa do evento `push` em main: depois do push,
      # `origin/main` já aponta para o próprio HEAD, e a catraca sairia sem olhar
      # o commit que acabou de entrar. `github.event.before` é o SHA anterior ao
      # push e resolve isso.
      #
      # A condição `event_name == 'push'` NÃO é decoração. O payload de
      # `pull_request` com action `synchronize` TAMBÉM traz `before` -- e ali ele
      # é o head ANTERIOR do PR, não o branch de destino. Sem a condição, um PR
      # atualizado passaria a ser verificado só a partir do último push, e uma
      # violação introduzida num commit anterior do mesmo PR deixaria de ser
      # vista. Em pull_request o valor tem de ser vazio, para o script cair no
      # fallback por GITHUB_BASE_REF e comparar com o branch de destino.
      - name: Catraca das migrations
        env:
          CATRACA_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: npm run check:migrations
