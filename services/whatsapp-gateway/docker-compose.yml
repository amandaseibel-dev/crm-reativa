services:
  whatsapp-gateway:
    build: .
    container_name: whatsapp-gateway
    restart: always
    env_file: .env
    ports:
      # Só o proxy reverso (Caddy/nginx com HTTPS) deve alcançar esta porta.
      # Publicar em 0.0.0.0 sem TLS na frente expõe o token de comando.
      - "127.0.0.1:3000:3000"
    volumes:
      - whatsapp-dados:/dados
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  whatsapp-dados:
