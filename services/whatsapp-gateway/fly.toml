# fly.toml app configuration file generated for reativa-whatsapp-gateway on 2026-08-24T10:48:19-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'reativa-whatsapp-gateway'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORTA = '3000'
  SESSOES = 'piloto,comercial'

[[mounts]]
  source = 'whatsapp_dados'
  destination = '/dados'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/saude'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
