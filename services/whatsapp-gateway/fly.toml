# fly.toml app configuration file generated for reativa-whatsapp-gateway on 2026-08-24T10:48:19-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'reativa-whatsapp-gateway'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORTA = '3000'
  # 10/09/2026: o Piloto foi aposentado (arquivado no CRM) e entrou o numero
  # Cobranca. Esta lista e a unica coisa que faz o gateway conhecer uma sessao:
  # com a chave fora daqui, o comando de conectar volta 502 e o QR nunca
  # aparece -- foi o que aconteceu ao cadastrar o Cobranca.
  #
  # ATENCAO: o valor em uso hoje esta como SECRET no Fly (secrets vencem o
  # [env] do fly.toml). Mudar so este arquivo NAO muda o gateway: e preciso
  # `fly secrets set SESSOES=... -a reativa-whatsapp-gateway`, que reinicia a
  # maquina -- os canais caem por segundos e voltam sozinhos, porque a
  # credencial vive no Postgres.
  SESSOES = 'comercial'

  # 08/10/2026: o Cobranca foi aposentado. So o Comercial fica no ar.
  #
  # POR QUE ESTA SEGUNDA LISTA, e nao so tirar 'cobranca' de SESSOES acima:
  # SESSOES esta como SECRET, e secret vence o [env] deste arquivo -- a linha
  # acima, sozinha, NAO derruba o Cobranca. SESSOES_APOSENTADAS nao tem secret
  # a sombrear, entao vale no proximo deploy e continua valendo mesmo que o
  # secret siga listando 'cobranca'.
  #
  # Aposentado nao reconecta, nao pede QR Code e nao envia. Nada e apagado: a
  # credencial fica no Postgres e o historico no CRM. Para devolver o numero ao
  # ar, tirar daqui -- nao precisa reparear.
  SESSOES_APOSENTADAS = 'cobranca'

[[mounts]]
  source = 'whatsapp_dados'
  destination = '/dados'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/saude'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
